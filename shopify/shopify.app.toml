client_id = "replace-me"
name = "Shopify plugin"
application_url = "https://example.com/plugin_settings"
embedded = true

[access_scopes]
scopes = "write_products"

[auth]
redirect_urls = [ "https://example.com/api/auth" ]

[webhooks]
api_version = "2025-01"

[[webhooks.subscriptions]]
topics = [ "app/uninstalled" ]
uri = "/shopify_plugin_demo/uninstall"

[build]
automatically_update_urls_on_dev = false

[app_proxy]
url = ""
prefix = "apps"
subpath = "recording-studio"
